[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # Neon's serverless driver uses the built-in WebSocket from Node 22.
    NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Single-page app: let React Router handle every non-API path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    # Only this site's own files may run. Blocks injected scripts (the app
    # holds customer numbers and an encrypted API key). Inline styles are
    # allowed because React and the chart library set them.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
