[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # Neon's serverless driver uses the built-in WebSocket from Node 22.
    NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Single-page app: let React Router handle every non-API path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
